<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
      max-width: 320px;
    }

    p {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.55;
      max-width: 300px;
      margin-bottom: 32px;
    }

    .open-btn {
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      padding: 18px 32px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.18);
      transition: transform 0.2s ease;
    }

    .open-btn:hover { transform: scale(1.02); }

    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 2a8 8 0 110 16A8 8 0 0112 4zm-1 3v6h6v-2h-4V7h-2z"/>
    </svg>
  </div>

  <h1>Continue to your browser for the best experience</h1>
  <p>This page works best outside the app. Tap below to open it in your default browser.</p>

  <button class="open-btn" id="openBtn">Open in Browser</button>
  <p class="note">You'll be redirected automatically</p>

  <script>
    const TARGET_URL = "https://driftloops.vercel.app/";

    function isAndroid() {
      return /android/i.test(navigator.userAgent);
    }

    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    document.getElementById("openBtn").addEventListener("click", function () {
      if (isAndroid()) {
        // Android intent to force Chrome
        const intentUrl =
          "intent://" +
          TARGET_URL.replace(/^https?:\/\//, "") +
          "#Intent;scheme=https;package=com.android.chrome;end";
        window.location.href = intentUrl;

        // Fallback: if intent didn't work, open normally
        setTimeout(function () {
          window.location.href = TARGET_URL;
        }, 1500);

      } else if (isIOS()) {
        // iOS: no reliable way to force Safari, best effort
        window.location.href = TARGET_URL;

      } else {
        window.location.href = TARGET_URL;
      }
    });
  </script>

</body>
</html>
