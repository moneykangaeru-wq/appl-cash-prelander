<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open in Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #22c55e;
      --line: #e5e7eb;
      --muted: #9ca3af;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
    }

    .open-container { text-align: center; padding: 28px 8px; }

    .open-icon {
      width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 22px;
      background: #121416; border: 1px solid var(--line); color: var(--green);
      display: flex; align-items: center; justify-content: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .lede {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.55;
      max-width: 300px;
      margin: 0 auto 32px;
    }

    .cta {
      display: block;
      background: #000;
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      padding: 18px 32px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(0,0,0,0.18);
      transition: transform 0.2s ease;
    }

    .cta:hover { transform: scale(1.02); }

    .browser-pills {
      display: flex; justify-content: center; gap: 8px;
      margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="open-container">
    <div class="open-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 7h10v10"></path>
        <path d="M7 17 17 7"></path>
      </svg>
    </div>
    <h1>Open in browser</h1>
    <p class="lede">Tap Continue to open this page in your browser and claim what's yours.</p>
    <a id="breakout-cta" class="cta" href="#">CONTINUE</a>
    <div class="browser-pills"><span>Safari</span><span>·</span><span>Chrome</span><span>·</span><span>Secure</span></div>
  </div>

  <script>
    var LANDER_URL = "https://deealsnest.vercel.app/";

    // Pass source param through if present
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var source = params.get("source");
        if (source) {
          LANDER_URL += (LANDER_URL.indexOf('?') === -1 ? '?' : '&') + 'source=' + encodeURIComponent(source);
        }
      } catch(e) {}
    })();

    function buildBreakoutUrl() {
      var dest = LANDER_URL;
      var ua = navigator.userAgent || '';
      if (/Android/i.test(ua)) {
        return 'intent://' + dest.replace(/^https?:\/\//, '') + '#Intent;scheme=https;end;';
      }
      if (/Instagram/i.test(ua)) {
        return 'instagram://extbrowser/?url=' + encodeURIComponent(dest);
      }
      // iOS / TikTok — force Safari
      return dest.replace(/^https:\/\//, 'x-safari-https://');
    }

    function runBreakout() {
      var url = buildBreakoutUrl();
      try {
        (window.top || window).location.href = url;
      } catch (err) {
        window.location.href = url;
      }
      // Fallback: if scheme blocked after 2s, just go to lander normally
      setTimeout(function() {
        window.location.href = LANDER_URL;
      }, 2000);
    }

    document.getElementById('breakout-cta').addEventListener('click', function(e) {
      e.preventDefault();
      runBreakout();
    });
  </script>

</body>
</html>
